# Build, test and scan images; optionally push them to Docker Hub.
# Called by pr.yml (no push) and release.yml (push).
#
# Each image folder builds two targets from one Dockerfile:
#   runtime -> <namespace>/<repo>:<tag>      and :<version>
#   dev     -> <namespace>/<repo>:<tag>-dev  and :<version>-dev
# An image with no runtime stage (Maven) builds only dev; list-images.sh sets
# each image's targets.
#
# Both must pass, before anything is pushed:
#   - the image's test.sh
#   - Docker Scout, with DHI's VEX: no fixable vulnerability of any severity.
#     Set the repository variable SCOUT_ONLY_FIXED to "false" to fail on
#     unfixed ones as well. Java images (Eclipse Temurin, Maven) fail on any
#     vulnerability, fixable or not, on both platforms.
#   - Trivy: no secret baked into a layer.
#
# Needs: secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub personal
# access token, read & write: pulls from dhi.io, runs Scout, pushes), and the
# repository variable DOCKERHUB_NAMESPACE (e.g. yongchenglow88).
name: Build

on:
  workflow_call:
    inputs:
      images:
        description: JSON array from .github/scripts/list-images.sh
        type: string
        required: true
      push:
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    name: ${{ matrix.image.repo }}:${{ matrix.image.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Publishing waits for the reviewers set on the "release" environment
    environment: ${{ inputs.push && 'release' || '' }}
    permissions:
      contents: read
      id-token: write   # cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    env:
      NAME: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.image.repo }}
      REPO: ${{ matrix.image.repo }}
      TAG: ${{ matrix.image.tag }}
      DOCKERFILE: ${{ matrix.image.path }}/Dockerfile
      TARGETS: ${{ join(matrix.image.targets, ' ') }}
      JAVA: ${{ matrix.image.java }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0 (arm64 builds on the amd64 runner)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to dhi.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # amd64 is loaded into the local daemon to test and scan; arm64 is
      # scanned by Scout from the pushed image in rescan.yml
      - name: Build (linux/amd64)
        run: |
          for target in $TARGETS; do
            docker buildx build --platform linux/amd64 --load --target "$target" \
              -t "local/$TAG-$target" -f "$DOCKERFILE" .
          done
      - name: Build (linux/arm64, to check it builds)
        run: |
          for target in $TARGETS; do
            load_args=()
            if [[ "$JAVA" == true ]]; then
              load_args=(--load -t "local/$TAG-$target-arm64")
            fi
            docker buildx build --platform linux/arm64 "${load_args[@]}" \
              --target "$target" -f "$DOCKERFILE" .
          done

      # test.sh takes the dev image, then the runtime image if there is one
      - name: Smoke test
        run: |
          images=()
          for target in $TARGETS; do images+=("local/$TAG-$target"); done
          "${{ matrix.image.path }}/test.sh" "${images[@]}"

      # The full version of the DHI runtime image (e.g. 3.14.10-debian13 for
      # the 3.14-debian13 folder), or of the dev image without its -dev suffix
      # when there is no runtime (3.10.1-r0-jdk21-alpine3.23 for Maven),
      # published as a second, pinned-version tag. Checked on PRs too, so a
      # label DHI changes fails before release.
      #
      # Eclipse Temurin is the exception: DHI's label drops the update number
      # of a JDK patch release (21.0.13.1+2 is labelled 21.0.13.2), so a fixed
      # build can sort below the one it replaces (21.0.13+9, 21.0.13.9). Its
      # tag is the JDK's own JAVA_VERSION with + as _, as in the Docker
      # Official Images (21.0.13.1_2-alpine3.23), and dev and runtime must
      # agree on it.
      - name: Read version
        run: |
          target=runtime
          if [[ " $TARGETS " != *" runtime "* ]]; then target=dev; fi
          if [[ "$REPO" == eclipse-temurin ]]; then
            java_version() {
              docker inspect --format '{{ range .Config.Env }}{{ println . }}{{ end }}' "$1" |
                sed -n 's/^JAVA_VERSION=[a-z]*-//p'
            }
            java=$(java_version "local/$TAG-$target")
            for t in $TARGETS; do
              if [[ "$(java_version "local/$TAG-$t")" != "$java" ]]; then
                echo "::error::JAVA_VERSION differs between targets of '$TAG'"
                exit 1
              fi
            done
            version="${java/+/_}-${TAG#*-}"
          else
            version=$(docker inspect --format '{{ index .Config.Labels "com.docker.dhi.version" }}' "local/$TAG-$target")
            if [[ $target == dev ]]; then version=${version%-dev}; fi
          fi
          if [[ ! "$version" =~ ^[0-9][0-9.]*(_[0-9]+)?(-[a-z0-9.]+)+$ || "$version" != *"-${TAG#*-}" ]]; then
            echo "::error::Version '$version' does not fit tag '$TAG'"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          tags="\`$version-dev\`"
          if [[ $target == runtime ]]; then tags="\`$version\`, $tags"; fi
          echo "Version tags: $tags" >> "$GITHUB_STEP_SUMMARY"

      - name: Java smoke test (linux/arm64)
        if: matrix.image.java
        run: |
          images=()
          for target in $TARGETS; do images+=("local/$TAG-$target-arm64"); done
          "${{ matrix.image.path }}/test.sh" "${images[@]}"

      # Secrets only: Docker Scout is the vulnerability gate, as it applies
      # DHI's VEX and matches what Docker Hub shows
      - name: Trivy secrets (dev)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ env.TAG }}-dev
          scanners: secret
          exit-code: '1'
      - name: Trivy secrets (runtime)
        if: contains(matrix.image.targets, 'runtime')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ env.TAG }}-runtime
          scanners: secret
          exit-code: '1'

      # The CLI rather than docker/scout-action: scans need --vex-location
      - name: Install Docker Scout
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh -o /tmp/scout-install.sh
          sh /tmp/scout-install.sh
      - name: Download DHI's VEX statements
        run: .github/scripts/dhi-vex.sh "$DOCKERFILE" vex linux/amd64 linux/arm64

      - name: Docker Scout
        run: |
          flags=(--exit-code --format markdown)
          if [[ "$JAVA" != true && "${{ vars.SCOUT_ONLY_FIXED }}" != false ]]; then
            flags+=(--only-fixed)
          fi
          if compgen -G "vex/*.json" > /dev/null; then
            flags+=(--vex-location vex)
          fi
          status=0
          for target in $TARGETS; do
            echo "### Docker Scout: $TAG $target" >> "$GITHUB_STEP_SUMMARY"
            docker scout cves "${flags[@]}" \
              "local://local/$TAG-$target" \
              >> "$GITHUB_STEP_SUMMARY" || status=1
          done
          if [[ "$JAVA" == true ]]; then
            for target in $TARGETS; do
              echo "### Docker Scout: $TAG $target (linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
              docker scout cves "${flags[@]}" --platform linux/arm64 \
                "local://local/$TAG-$target-arm64" >> "$GITHUB_STEP_SUMMARY" || status=1
            done
          fi
          exit $status

      - name: Push (linux/amd64 + linux/arm64) and sign
        if: inputs.push
        run: |
          for target in $TARGETS; do
            suffix=$([[ $target == dev ]] && echo -dev || true)
            docker buildx build --platform linux/amd64,linux/arm64 --target "$target" \
              --sbom=true --provenance=mode=max \
              --label org.opencontainers.image.vendor="National University Health System" \
              --label org.opencontainers.image.licenses=Apache-2.0 \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              --label org.opencontainers.image.version="$VERSION$suffix" \
              -t "$NAME:$TAG$suffix" -t "$NAME:$VERSION$suffix" \
              --metadata-file "/tmp/$target.json" --push -f "$DOCKERFILE" .
            digest=$(jq -r '."containerimage.digest"' "/tmp/$target.json")
            echo "$NAME:$TAG$suffix@$digest" >> /tmp/pushed
            # So anyone's Scout scan of the published image applies DHI's VEX
            # (rescan.yml checks it does). All of it: the runtime image also
            # carries packages taken from DHI's -dev image.
            vex_files=()
            shopt -s nullglob
            for f in vex/*.json; do vex_files+=(--file "$f"); done
            if ((${#vex_files[@]})); then
              docker scout attestation add --predicate-type https://openvex.dev/ns/v0.2.0 \
                "${vex_files[@]}" "$NAME:$TAG$suffix@$digest"
            fi
          done

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3 (cosign v3)
        if: inputs.push
      - name: Sign
        if: inputs.push
        run: |
          while read -r ref; do
            cosign sign --yes "$ref"
            echo "- \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/pushed
