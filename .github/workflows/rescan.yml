# Nightly: scan the published images, both targets and both platforms, with
# Docker Scout. Each image gets at most one open issue, covering its runtime
# and -dev tags on both platforms: a vulnerability found since the last
# release opens it or comments on it, and a night on which all four scans of
# the image pass closes it.
# The fix is usually a newer DHI digest: merge Dependabot's PR, or run
# Release by hand to rebuild on the latest one.
name: Rescan

on:
  schedule:
    - cron: "0 18 * * *"   # 02:00 Singapore time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "images=$(.github/scripts/list-images.sh)" >> "$GITHUB_OUTPUT"

  scan:
    needs: list
    # The report job parses this name: "scan <repo>:<tag> <target> <platform>"
    name: scan ${{ matrix.image.repo }}:${{ matrix.image.tag }} ${{ matrix.variant || 'runtime' }} ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.list.outputs.images) }}
        variant: ["", "-dev"]
        platform: [linux/amd64, linux/arm64]
    env:
      REF: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.image.repo }}:${{ matrix.image.tag }}${{ matrix.variant }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The report job reads this step's result by its name.
      - name: Docker Scout
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: cves
          image: registry://${{ env.REF }}
          platform: ${{ matrix.platform }}
          only-fixed: ${{ matrix.image.repo != 'eclipse-temurin' && vars.SCOUT_ONLY_FIXED != 'false' }}
          exit-code: true
          summary: true

  # One job opens, updates and closes the issues, after every scan, so parallel
  # scans of the same image cannot each open their own.
  report:
    needs: [list, scan]
    if: always() && needs.list.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read   # to read the scan jobs' results
      issues: write   # to open, update and close the issues
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - name: Open, update or close one issue per image
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # One line per scan job: "<repo>:<tag> <target> <platform> <Scout step result>".
          # A job that failed before Scout ran (a login error, say) reports
          # "missing" and neither opens nor closes an issue.
          gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name | startswith("scan "))
                  | "\(.name | ltrimstr("scan ")) \((.steps[] | select(.name == "Docker Scout") | .conclusion) // "missing")"' \
            > results.txt
          cat results.txt

          # fd 3, so gh inside the loop cannot read the image list from stdin.
          while read -r image <&3; do
            # --search matches words, not the exact title: filter on it in jq.
            export TITLE="Vulnerabilities in $NAMESPACE/$image"
            number=$(gh issue list --state open --limit 100 --search "in:title \"$TITLE\"" --json number,title \
              --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
            failed=$(awk -v i="$image" '$1 == i && $4 == "failure" { print "- `" $2 "` on `" $3 "`" }' results.txt)
            unfinished=$(awk -v i="$image" '$1 == i && $4 != "success" && $4 != "failure"' results.txt)

            if [[ -n "$failed" ]]; then
              body=$(printf 'Docker Scout found vulnerabilities in the published %s:\n\n%s\n\n%s\n' \
                "\`$NAMESPACE/$image\`" "$failed" "$run_url")
              if [[ -n "$number" ]]; then
                gh issue comment "$number" --body "$body"
              else
                gh issue create --title "$TITLE" --body "$body"
              fi
            elif [[ -n "$number" && -z "$unfinished" ]]; then
              gh issue close "$number" --comment "All scans of the runtime and -dev tags, on both platforms, pass: $run_url"
            fi
            # Otherwise no vulnerability, but a scan did not finish: leave any issue as it is.
          done 3< <(cut -d' ' -f1 results.txt | sort -u)
